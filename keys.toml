# Left leaves the preview the way Escape does, in the plain kinds only. ui/js/Focus.js discarded
# seekBack on every kind but media and a PDF, so on an image, a text file or an archive listing the
# key did nothing whatever; it closes there now. A media preview and a PDF keep it, because Left is
# the only key either has left for seeking back and turning a page back once h belongs to the
# presets that spell the arrows as letters.
[[preset]]
name = "all"
mods = "none"
key = "Left"
keys = "left"
action = "escape"
label = "close"
frontend = "all"
context = "preview"

[[preset]]
name = "all"
mods = "none"
key = "Left"
keys = "left"
action = "seekBack"
label = "seekBack"
frontend = "all"
context = "pdf,media"

[[preset]]
name = "all"
mods = "none"
key = "Right"
keys = "right"
action = "seekForward"
label = "seekForward"
frontend = "all"
context = "preview,pdf,media"

[[preset]]
