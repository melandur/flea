[[preset]]
name = "all"
mods = "none"
key = "Return"
keys = "return"
action = "open"
label = "open"
frontend = "all"
context = "rail,menu,panel,preview,pdf,media"

[[preset]]
name = "all"
mods = "none"
key = "Enter"
keys = "enter"
action = "open"
label = "open"
frontend = "all"
context = "rail,menu,panel,preview,pdf,media"

[[preset]]
name = "all"
mods = "none"
key = "Space"
keys = "space"
