# Finder's table with Cmd read as Ctrl, which is also what Omarchy's universal clipboard injects
# (SUPER+C/V/X arrive here as CTRL+C/V/X, see clipboard.lua) and what GTK binds. Every chord is
# additive: the bare vim key beside it stays. Cmd+D is the one Finder chord not taken, because
# Ctrl+D above already pages with Ctrl+U as its pair; Duplicate stays a menu row.
[[ctrl]]
key = "C"
action = "copy"

[[ctrl]]
key = "V"
action = "paste"

[[ctrl]]
key = "X"
action = "cut"

[[ctrl]]
key = "Z"
action = "undo"

[[ctrl]]
key = "F"
action = "search"

# The listing menu's Copy path row, on a key: the full path of the row under the cursor. Ctrl+B is
# the editor chord for a sidebar, which is what this key was, and the rail moved to Ctrl+G below to
# free it. Y beside it copies the directory the listing is showing, which is a different string and
# stays its own action.
[[ctrl]]
key = "B"
action = "copypath"

# RailAdditions rule 4 (issue 112, muellan): the rail hides and comes back on a chord, and the
# choice is remembered in ui.json the way the view is. Ctrl+G, because Ctrl+B above now carries the
# path and nothing else on this box claims G at all.
[[ctrl]]
key = "G"
action = "sidebar"

# The split, both ways on the one chord: the fourth chrome mode had no key at all, so the only way
# into two panes and the only way back out was the pointer. Ctrl+T is the chord every tabbed browser
# and both of Omarchy's terminals put a second pane or tab on, and this window has no tab of its own
# for it to collide with. It toggles rather than chooses because the split is a window shape and not
# a view a pane can be in: dual.from remembers which of the three the window was left in.
[[ctrl]]
key = "T"
action = "toggleDual"

# The three creation and visibility chords, operator's ruling of 2026-09-18. New Folder moved off
# Ctrl+Shift+N, which was Nautilus's own and Finder's with Cmd read as Ctrl, onto the bare Ctrl+N
# that every one of them also answers; the window still reaches the backend's mkdir through
# Ops.newFolder. New File is Ctrl+M rather than a second shifted N: it opens the same name dialog
# the menu row opens, through ui/Pane.qml act, which is why neither needs a case in Focus.act.
[[ctrl]]
key = "N"
action = "newFolder"

[[ctrl]]
key = "M"
action = "newFile"

# Ctrl+H is the hidden-files toggle in Nautilus, Thunar and Nemo alike, so it is the one chord a
# user arriving from any of them already has in their fingers. ui/js/Menu.js keeps drawing the row
# as well: "Show hidden files" is one of the two actions the settings panel refuses to switch off,
# because it is the one background row with no keyboard-independent alternative.
[[ctrl]]
key = "H"
action = "toggleHidden"

# Checked before the plain ctrl rows and falling through when unmatched, so Ctrl+Shift+D still
# pages. Shift+period is delivered as Greater on a US layout and as Period elsewhere, so both rows
# name the one action.

# Bindings on the key code, for the keys that carry no printable character. The four arrows lead the
# table: they are the navigation the Default preset has and the only navigation it has, so they are
# the spelling the keymap sheet should reach for first.
[[code]]
key = "Down"
action = "cursorDown"

[[code]]
key = "Up"
action = "cursorUp"

# The horizontal pair, in the list, the columns and both dual panes: Left goes up a level and Right
# browses in. A preview takes them back through the preview-context rows at the end of this file,
# where they seek in media and turn the page in a PDF, and the grid claims them as its own sideways
# move in ui/js/Focus.js before the map is consulted at all.
[[code]]
key = "Left"
action = "parent"

[[code]]
key = "Right"
action = "pageForward"

[[code]]
key = "Return"
action = "open"

[[code]]
key = "Enter"
action = "open"

[[code]]
key = "Delete"
action = "trash"

[[code]]
key = "Escape"
action = "escape"

# The only thing that moves focus between the list and the rail, see ui/js/Focus.js.
[[code]]
key = "Tab"
action = "focusNext"

# Space already owns "open preview" in the browsing state ui/js/Focus.js act handles, and
# ui/js/PreviewKeys.js act reuses the same action name to mean "close" once a preview is open, on
# every kind including media, so there is no free context left for a third meaning; v toggles selection.
[[code]]
key = "Space"
action = "preview"

# F2 shares the "rename" action "r" carries below; ui/js/Focus.js dispatches it by focus view.
[[code]]
key = "F2"
action = "rename"

# The keyboard's way into the menu a right click raises: the row's own menu in the listing, Eject
# and Unmount in the rail. The tagline is "keyboard-first" and before this key neither had one, so
# m is no longer a type-ahead letter; ui/js/Focus.js routes it by which view has focus.
[[text]]
char = "m"
action = "menu"

# The Settings board's own key: "," from anywhere in the window, no modifier chord, because
# Omarchy's universal clipboard consumes SUPER+C/V/X and a settings panel is the last place to
# fight for one. ui/Pane.qml routes it from the list and from the rail alike.
[[text]]
char = ","
action = "settings"

# The sheet's own key. Shift falls through to the text switch, so ? needs no [[shift]] row.
[[text]]
char = "?"
action = "keymapSheet"

# KeymapSheet.html rule 1: a binding gets a group and the sheet reads it. The group is named by
# action rather than written on every binding, because one action is spelled four different ways
# across the presets and its group is the same in all four; the generator fails the build if an
# action the listing binds is missing here or named twice. The order is the order the sheet draws,
# and the heading is the key with its first letter capitalised.
# Move is where the cursor, the pane or the window goes. Look is what is drawn and how big. Find
# narrows or orders what is already listed. Change writes something, or opens the surface that does.
[sheetgroups]
move = ["cursorDown", "cursorUp", "open", "parent", "pageForward", "focusNext", "escape"]
look = ["preview", "sidebar", "toggleDual", "toggleHidden", "mute", "keymapSheet"]
find = ["search"]
change = ["copy", "cut", "paste", "copypath", "rename", "trash", "undo", "newFolder", "newFile",
          "menu", "settings"]

# The digit range, expanded by the generator into tab1 through tab9.
[digits]
from = 1
to = 9
prefix = "tab"

# The keymap sheet ? opens, in the order the canvas's Keys panel draws it, two columns down.
# A chord shares the row of the key it doubles, written ^c for ctrl and ^N (a capital, the table's
# own shift convention) for ctrl-shift, so the sheet stays two columns. Two rows keep the bare key
# alone: "f ^f" beside "find in subtree" and "a ^k" beside "add network place" overrun the 154 px
# column at base-size 14 in JetBrainsMono (155 and 169 px measured); the README carries those two.
# keys is what the cap prints, action is what the first of those keys must resolve to, and label is
# the wording. tests/js/keymap.js checks every action against the table above, so a row here cannot
# advertise a key that is not bound. Each block writes keys, then action, then label, in that order.

[[sheet]]
keys = "down up"
action = "cursorDown"
label = "move"

[[sheet]]
keys = "enter"
action = "open"
label = "open"

[[sheet]]
keys = "left"
action = "parent"
label = "parent"

[[sheet]]
keys = "right"
action = "pageForward"
label = "browse in"

[[sheet]]
keys = "space"
action = "preview"
label = "quick look"

[[sheet]]
keys = "^f"
action = "search"
label = "find"

[[sheet]]
keys = "tab"
action = "focusNext"
label = "scope / focus"

[[sheet]]
keys = "^g"
action = "sidebar"
label = "sidebar"

[[sheet]]
keys = "^c"
action = "copy"
label = "copy"

[[sheet]]
keys = "^b"
action = "copypath"
label = "file path"

[[sheet]]
keys = "^x"
action = "cut"
label = "cut"

[[sheet]]
keys = "^v"
action = "paste"
label = "paste"

[[sheet]]
keys = "f2"
action = "rename"
label = "rename"

[[sheet]]
keys = "delete"
action = "trash"
label = "trash"

[[sheet]]
keys = "^z"
action = "undo"
label = "undo"

[[sheet]]
keys = "^N"
action = "newFolder"
label = "new folder"

[[sheet]]
keys = "m"
action = "menu"
label = "menu"

[[sheet]]
keys = ","
action = "settings"
label = "settings"

[[sheet]]
keys = "?"
action = "keymapSheet"
label = "keys"

# The pointer contract, the mouse's half of this table. tools/flea-keymap-gen turns it into
# Keymap.POINTER and tests/js/tap.js drives ui/js/Tap.js against every listing and neighbour row, so
# a click cannot change meaning without this file saying so and this file cannot advertise a click
# the code does not make.
#
# The effect field is "does" and not "action" on purpose. tools/flea-acceptance derives its whole key
# checklist from every 'action = ' line in this file, without scoping to a table, so an action= here
# would put a key on that checklist that nobody can press. Do not rename it back.
#
# where  listing    the list view, the grid view, and the columns view's own middle column
#        column     the columns view's middle column alone, which answers every listing row above
#                   and then the one row of its own that the other two views do not carry
#        neighbour  the columns view's parent and child columns, which are peeks with no cursor
#        rail       ui/SidebarRow.qml: favourites, mounts and network places
#        window     a press that belongs to no row at all, taken by ui/shell.qml
#        chrome     ui/ChromeBar.qml's path above the listing, whose segments are their own targets
# press  the button, then any modifier before it, then "x2" for the second tap of a double click
# row    which rows the line covers: any, dir, file, parent, renaming or result
# does   backOrParent commitRename extendSelect goToCrumb menu nothing open pathBar reveal selectOnly toggleSelect
#
# Enter opens and is in the [[code]] table above, not here: this is the pointer's half only. The rail
# opens on one tap, as Finder's own sidebar does and as every other rail in Omarchy does, which is
# why the listing's two-tap rule stops at the rail's edge.

[[pointer]]
where = "listing"
press = "left"
row = "any"
does = "selectOnly"
label = "put the cursor on the row and drop any other selection"

[[pointer]]
where = "listing"
press = "left x2"
row = "any"
does = "open"
label = "open the row"

# The operator's ruling on a search result: clicking one takes you to the file rather than launching
# it, and one tap is what does it (2026-09-11), because a result you clicked is a result you are done
# reading. ui/js/Search.js activateAction is what decides, and it answers "open" everywhere else,
# which is why the row above still stands. Enter still opens and o still reveals, so only the pointer
# reads the search this way. The reveal moves the pane, so the second tap of a double click lands on
# another directory's row: it is declared below as doing nothing, the neighbour columns' own rule.
[[pointer]]
where = "listing"
press = "left"
row = "result"
does = "reveal"
label = "go to the file in its own directory, selected"

[[pointer]]
where = "listing"
press = "left x2"
row = "result"
does = "reveal"
label = "still the one reveal the first tap made"

[[pointer]]
where = "listing"
press = "ctrl left"
row = "any"
does = "toggleSelect"
label = "add the row to the selection"

[[pointer]]
where = "listing"
press = "shift left"
row = "any"
does = "extendSelect"
label = "extend the selection to the row"

# A modifier never opens, whatever the tap count, and only the first tap of one counts: a ctrl-held
# double click that toggled twice would put the selection back where it started.
[[pointer]]
where = "listing"
press = "ctrl left x2"
row = "any"
does = "toggleSelect"
label = "still only selects"

[[pointer]]
where = "listing"
press = "shift left x2"
row = "any"
does = "extendSelect"
label = "still only selects"

# Finder commits an inline rename when you click away. A TapHandler never moves Qt focus, so
# ui/RenameField.qml's onActiveFocusChanged cannot carry this and ui/js/Tap.js asks the pane
# explicitly. The keyboard survives the close because the field gives up focus when it hides, in
# ui/RenameField.qml, and not because the view takes focus back: forcing focus onto a ListView
# re-selects the hidden field, which is the focus scope's remembered child.
[[pointer]]
where = "listing"
press = "left"
row = "renaming"
does = "commitRename"
label = "commit the open rename, then select the row"

# The pressed row decides which rows the menu means, ui/js/Drag.js carried()'s rule for the pointer's
# other gesture. A menu raised inside a multi-row selection acts on all of it, as Finder does, and one
# raised outside collapses the selection to that row, because every entry the menu draws is built from
# the cursor row while Move to Trash, Compress and Move to Dropbox all dispatch through the selection.
[[pointer]]
where = "listing"
press = "right"
row = "any"
does = "menu"
label = "open the context menu at the pointer, on the selection the row is in"

# The operator's ruling, 2026-09-11: the columns view goes into a directory on one tap, the way both
# of its own neighbour columns already do and the way Finder's column view does. Only a directory and
# only here: a file in this column still waits for the second tap, and one tap in the list and the
# grid still only selects. ui/ColumnsArea.qml is the sole caller of ui/js/Tap.js tappedMiddle, which
# is what scopes this to the middle column; a modifier still selects, because it never opens anywhere.
[[pointer]]
where = "column"
press = "left"
row = "dir"
does = "open"
label = "go into that directory on one tap, as its neighbours do"

# A neighbour column has no cursor, so one tap on a directory makes it the pane's own listing: that is
# the column view's reveal, the gesture Finder's own column view answers a single click with, and not
# an open. A file has nothing to reveal, so it waits for the second tap.
[[pointer]]
where = "neighbour"
press = "left"
row = "dir"
does = "reveal"
label = "show that directory in the middle column"

[[pointer]]
where = "neighbour"
press = "left"
row = "file"
does = "nothing"
label = "a file has no contents to reveal"

[[pointer]]
where = "neighbour"
press = "left x2"
row = "file"
does = "open"
label = "open the file"

# Every menu action addresses the pane's cursor and a peeked row is another directory's, so the two
# neighbour columns raise no menu at all rather than one whose entries would act somewhere else.
[[pointer]]
where = "neighbour"
press = "right"
row = "any"
does = "nothing"
label = "a peeked row has no menu"

# Issue 45: the path above the listing is a control now as well as a label. Every segment but the
# leaf opens its own directory on one tap, through the same pathEntered route the typed bar uses; the
# leaf is the directory already listed, so it has nowhere of its own to go, and the frozen List view
# board draws it in the foreground role while every segment above it is muted. The row column reads
# "parent" for that reason: a row saying "crumb" would promise a press the leaf never answers. The
# double click that opens the bar is declared beside it because the crumb answers that press too:
# the tap count alone decides between them, and neither runs with the other, measured on the box.
[[pointer]]
where = "chrome"
press = "left"
row = "parent"
does = "goToCrumb"
label = "open the directory that segment of the path names"

[[pointer]]
where = "chrome"
press = "left x2"
row = "any"
does = "pathBar"
label = "type the path instead of clicking it"

# Issue 20: the mouse's extra button. It belongs to the window rather than to a row, so it is the one
# line here with no listing under it; ui/js/Nav.js mouseBack decides, and ui/shell.qml refuses it
# behind a dialog, an open preview, the share overlay and any field holding the keyboard.
[[pointer]]
where = "window"
press = "back"
row = "any"
does = "backOrParent"
label = "go back through the history, or up a directory when there is none"

[[pointer]]
where = "rail"
press = "left"
row = "any"
does = "open"
label = "open the place"

[[pointer]]
where = "rail"
press = "right"
row = "any"
does = "menu"
label = "eject and unmount"

[[preset]]
