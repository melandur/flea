[package]
name = "flea-iced"
version = "0.0.1"
edition = "2021"
publish = false

# Its own workspace, so the backend's Cargo.lock and its empty dependency list stay untouched.
[workspace]

[[bin]]
name = "flea-iced"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
strip = true
